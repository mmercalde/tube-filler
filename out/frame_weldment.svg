<text x="99.7" y="1256.4" class="d" text-anchor="middle">32</text>
<text x="70.0" y="1276.4" class="d" text-anchor="start">NO MOTOR, NO REDUCER, NO COUPLING.  The drill chucks straight onto the hex stub.</text>
<text x="70.0" y="1292.4" class="d" text-anchor="start">Operator stands at +y, one hand on the trigger.  The frame holds the drill.</text>
<text x="1000.0" y="790.0" class="s" text-anchor="start">CUT LIST   (square cuts unless noted)</text>
<text x="1000.0" y="814.0" class="t" text-anchor="start">QTY  LENGTH    MEMBER              STOCK</text>
<line x1="1000.0" y1="820.0" x2="1560.0" y2="820.0" class="thin"/>
<text x="1000.0" y="838.0" class="t" text-anchor="start">2    1450      skid rail           PTR 51x51x3</text>
<text x="1000.0" y="857.0" class="t" text-anchor="start">2    1300      top rail            PTR 51x51x3</text>
<text x="1000.0" y="876.0" class="t" text-anchor="start">2    697       drill brace         PTR 51x51x3</text>
<text x="1000.0" y="895.0" class="t" text-anchor="start">1    641       drill upright       PTR 51x51x3</text>
<text x="1000.0" y="914.0" class="t" text-anchor="start">4    640       knee brace          PTR 51x51x3</text>
<text x="1000.0" y="933.0" class="t" text-anchor="start">6    589       leg                 PTR 51x51x3</text>
<text x="1000.0" y="952.0" class="t" text-anchor="start">6    549       skid cross          PTR 51x51x3</text>
<text x="1000.0" y="971.0" class="t" text-anchor="start">3    549       top cross           PTR 51x51x3</text>
<text x="1000.0" y="990.0" class="t" text-anchor="start">1    220       drill rail          PTR 51x51x3</text>
<text x="1000.0" y="1009.0" class="t" text-anchor="start">1    46        cradle outrigger    PTR 51x51x3</text>
<line x1="1000.0" y1="1015.0" x2="1560.0" y2="1015.0" class="thin"/>
<text x="1000.0" y="1032.0" class="t" text-anchor="start">     18.8      TOTAL PTR (m)       +10% = order 21 m</text>
<text x="1000.0" y="1066.0" class="t" text-anchor="start">WELD NOTES   (3.05 mm wall -- do not chase full penetration)</text>
<text x="1000.0" y="1084.0" class="t" text-anchor="start">  1. 4 mm fillet, both sides where you can reach; elsewhere 40 mm stitch at 80 mm pitch.</text>
<text x="1000.0" y="1102.0" class="t" text-anchor="start">  2. 7018 at 80-95 A, or 0.030 wire on C25 at ~130 A.  Back the heat off if you blow</text>
<text x="1000.0" y="1120.0" class="t" text-anchor="start">     through -- the frame is nowhere near stress-limited and burn-through is the only risk.</text>
<text x="1000.0" y="1138.0" class="t" text-anchor="start">  3. Tack the whole skid first.  Check the two diagonals equal within 2 mm.  THEN weld out.</text>
<text x="1000.0" y="1156.0" class="t" text-anchor="start">  4. Weld the top rails LAST, with the barrel clamped in its saddles.  The barrel, not the</text>
<text x="1000.0" y="1174.0" class="t" text-anchor="start">     frame, is the alignment datum for the whole machine.</text>
<text x="1000.0" y="1192.0" class="t" text-anchor="start">  5. Barrel saddles: 2 off, 6 mm plate, R38.1 notch,</text>
<text x="1000.0" y="1210.0" class="t" text-anchor="start">     21 mm tall, on the top rails at x = -100 and x = -520.</text>
<text x="1000.0" y="1228.0" class="t" text-anchor="start">     Top rails are set by the STATOR (89 OD), not the barrel; the printed</text>
<text x="1000.0" y="1246.0" class="t" text-anchor="start">     stator cradle is 59 mm high to suit.  See params.py.</text>
<text x="1000.0" y="1264.0" class="t" text-anchor="start">  6. Pillow-block sub-plate: 10 mm, 4 x M12 in 14 x 40 SLOTS running along x,</text>
<text x="1000.0" y="1282.0" class="t" text-anchor="start">     so the whole drive train can be drawn rearward to change the auger.</text>
<text x="1000.0" y="1300.0" class="t" text-anchor="start">  7. Lifting eyes: 4 off, 12 mm plate, 30 mm hole, on the top rails above the legs.</text>
<text x="1000.0" y="1318.0" class="t" text-anchor="start">  8. DRILL STATION -- ONE 10 mm bracket on top of the upright does both jobs:</text>
<text x="1000.0" y="1336.0" class="t" text-anchor="start">     a half-round torque lug at its front edge, cut to the measured</text>
<text x="1000.0" y="1354.0" class="t" text-anchor="start">     43 mm aux-handle collar, and a 46 mm flat behind it</text>
<text x="1000.0" y="1372.0" class="t" text-anchor="start">     carrying the printed saddle.  The LUG IS THE ONLY TORQUE PATH; the printed</text>
<text x="1000.0" y="1390.0" class="t" text-anchor="start">     saddle clamps and nothing else.  Weld both drill braces -- unbraced, that</text>
<text x="1000.0" y="1408.0" class="t" text-anchor="start">     upright sags 2.4 mm under the 1160 N reaction and the drill cocks.</text>
<text x="1000.0" y="1426.0" class="t" text-anchor="start">  9. Paint everything.  Mask the clamp-plate faces -- they are gasket faces.</text></svg>